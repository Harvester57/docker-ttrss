user www-data;
worker_processes auto;
pid /tmp/nginx.pid;
daemon off;

events {
    worker_connections 1024;
    use epoll;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    types {
        application/manifest+json  webmanifest;
        font/ttf                   ttf;
    }

    access_log /var/log/nginx/access.log;
    error_log /dev/stderr warn;

    sendfile on;
    keepalive_timeout 15;
    keepalive_disable msie6;
    keepalive_requests 100;
    tcp_nopush on;
    tcp_nodelay on;
    server_tokens off;

    fastcgi_temp_path /tmp/fastcgi 1 2;
    client_body_temp_path /tmp/client_body 1 2;
    proxy_temp_path /tmp/proxy 1 2;
    uwsgi_temp_path /tmp/uwsgi 1 2;
    scgi_temp_path /tmp/scgi 1 2;

    gzip on;
    gzip_comp_level 6;
    gzip_static on;
    gzip_min_length 256;
    gzip_proxied any;
    gzip_vary on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml application/manifest+json font/ttf;

    map $args $ttrss_static_cache {
        default                "no-cache";
        "~^[0-9a-zA-Z]+$"      "public, max-age=31536000, immutable";
    }

    server
    {
        listen                    8080;
        root                      /var/www/ttrss;

        #ssl_certificate           /etc/ssl/certs/ttrss.crt;
        #ssl_certificate_key       /etc/ssl/private/ttrss.key;
        #ssl_session_timeout 1d;
        #ssl_session_cache shared:MozSSL:10m;  # about 40000 sessions
        #ssl_session_tickets off;
        #ssl_protocols TLSv1.2 TLSv1.3;
        #ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
        #ssl_prefer_server_ciphers off;
        #ssl_ecdh_curve X25519:secp521r1:secp384r1:prime256v1;

        index index.php index.html;
        client_max_body_size 100M;

        rewrite ^/healthz$ /public.php?op=healthcheck last;

        location /cache {
            internal;
        }

        location /backups {
            internal;
        }

        location ~ ^/(lock|sql|schema|classes|include|utils)/ {
            deny all;
        }

        location ~ ^/vendor/(?!mervick/material-design-icons/) {
            deny all;
        }

        location ~ /\.(?!well-known) {
            deny all;
        }

        location / {
            try_files $uri $uri/ =404;
            add_header Cache-Control $ttrss_static_cache;
        }

        location ~ /plugins\.local/.*/api/.*\.php(/|$) {
            fastcgi_split_path_info ^(.+?\.php)(/.*)$;
            try_files $fastcgi_script_name =404;
            set $path_info $fastcgi_path_info;
            fastcgi_param PATH_INFO $path_info;
            fastcgi_pass unix:/tmp/php-fpm.sock;
            fastcgi_index index.php;
            include fastcgi_params;
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
            fastcgi_intercept_errors off;
            fastcgi_buffer_size 16k;
            fastcgi_buffers 4 16k;
        }

        location ~ \.php$ {
            fastcgi_split_path_info ^(.+?\.php)(/.*)$;
            try_files $fastcgi_script_name =404;
            fastcgi_pass unix:/tmp/php-fpm.sock;
            fastcgi_index index.php;
            include fastcgi_params;
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
            fastcgi_intercept_errors off;
            fastcgi_buffer_size 16k;
            fastcgi_buffers 4 16k;
        }
    }
}
